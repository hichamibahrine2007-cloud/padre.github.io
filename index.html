<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PADRE IV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="3d74804f2dfe74fd6180ec98d3d13e58-modified.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Fira+Code:wght@500&display=swap');

      
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; cursor: none !important; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #ffffff; overflow: hidden; color: white; }

        
        #custom-cursor {
            position: fixed; width: 45px; height: 45px;
            background-image: url('cursor.png'); background-size: contain; background-repeat: no-repeat;
            pointer-events: none; z-index: 10000; transform: translate(-5px, -5px);
            filter: drop-shadow(0 0 5px #184ad3); transition: transform 0.05s ease-out;
        }

        .video-container { position: fixed; inset: 0; z-index: -1; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.2); }
        .particle { position: fixed; top: -50px; z-index: 0; pointer-events: none; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

      
        .card {
            position: relative; width: 350px; height: 450px;
            background: rgba(0, 0, 0, 0.9); border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; opacity: 0; transform: translateY(30px); transition: 1.5s;
            z-index: 10; border: 1px solid rgba(255, 252, 252, 0.1);
        }
        .card.show { opacity: 1; transform: translateY(0); }
        .card::before {
            content: ''; position: absolute; width: 180px; height: 140%;
            background: linear-gradient(#0a69e6, #001c33); animation: rotate 4s linear infinite;
        }
        .card::after { content: ''; position: absolute; inset: 4px; background: #0a0505; border-radius: 16px; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

       
        .content { position: relative; z-index: 20; text-align: center; width: 100%; padding: 20px; }
        .img-box {
            width: 110px; height: 110px; margin: 0 auto 15px; border-radius: 50%; padding: 3px;
            background: linear-gradient(45deg, #003cff, #000000); box-shadow: 0 0 20px rgba(0, 26, 255, 0.3);
        }
        .img-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #000; }
        
        h2 { font-size: 1.6rem; color: #ffffff; }
        p.dev-title { color: #888; font-size: 0.8rem; margin-bottom: 20px; }

        .social-icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .social-icons a { color: white; font-size: 1.4rem; transition: 0.3s; }
        .social-icons a:hover { color: #0044ff; transform: scale(1.2); }

    
        .typing-container {
            font-family: 'Fira Code', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            color: #0066ff;
            text-shadow: 0 0 10px rgba(0, 110, 255, 0.7);
            min-height: 24px;
        }
        .cursor-blink { animation: blink 0.8s infinite; border-left: 3px solid #002fff; margin-left: 5px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* UI Elements */
        #overlay { position: fixed; inset: 0; background: #000000; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: 1s; }
        #overlay h1 { font-size: 1.8rem; letter-spacing: 5px; color: #0026ff; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        #mute-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #444; z-index: 30; }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <div id="overlay" onclick="startExperience()">
        <h1>[ 3FAT HNA ]</h1>
    </div>

    <div class="video-container">
        <video id="bgVideo" loop muted playsinline>
            <source src="A2K - GANG (Clip officiel).mp4" type="video/mp4">
        </video>
    </div>

    <div class="card" id="mainCard">
        <button id="mute-btn"><i class="fas fa-volume-up" id="mute-icon"></i></button>
        <div class="content">
            <div class="img-box"><img src="a.jpg" alt="Profile"></div>
            <h2>PADRE IV</h2>
            <p class="dev-title"></p>
            
            <div class="social-icons">
                <a href="https://youtube.com/@padreiv?si=yx90ze4UV7SqYBF7"><i class="fab fa-youtube"></i></a>
                <a href="https://kick.com/padrexx"><i class="fab fa-Kick"></i></a>
                <a href="https://discord.gg/CSUXMJHuTj"><i class="fab fa-discord"></i></a>
            </div>

            <div class="typing-container">
                <span id="typing-text"></span><span class="cursor-blink"></span>
            </div>
        </div>
    </div>

    <script>
        const cursor = document.getElementById('custom-cursor');
        const video = document.getElementById('bgVideo');
        const overlay = document.getElementById('overlay');
        const card = document.getElementById('mainCard');
        const typingElement = document.getElementById('typing-text');

     
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

       
        const text = "Gaming Content Creator";
        let index = 0;
        let isDeleting = false;

        function typeAnimation() {
            const currentText = isDeleting 
                ? text.substring(0, index--) 
                : text.substring(0, index++);

            typingElement.textContent = currentText;

            let speed = isDeleting ? 100 : 200;

            if (!isDeleting && index > text.length) {
                isDeleting = true;
                speed = 2000; 
            } else if (isDeleting && index < 0) {
                isDeleting = false;
                index = 0;
                speed = 500; 
            }

            setTimeout(typeAnimation, speed);
        }

        
        function startExperience() {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                card.classList.add('show');
                video.muted = false;
                video.play();
                typeAnimation(); 
                createRain();
            }, 800);
        }

        // Mute Logic
        document.getElementById('mute-btn').addEventListener('click', () => {
            video.muted = !video.muted;
            document.getElementById('mute-icon').className = video.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
        });

        // Rain Effect
        function createRain() {
            setInterval(() => {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.width = '3px'; p.style.height = '3px';
                p.style.background = '#ff0000';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 4000);
            }, 200);
        }
    </script>
</body>
</html>
